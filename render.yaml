services:
  # ── Backend (Node.js / Express) ─────────────────────────────────────────────
  - type: web
    name: healthcare-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # *** Set these secret values in the Render dashboard ***
      - key: PORT
        value: 10000           # Render assigns 10000 internally; keep this in sync
      - key: JWT_SECRET
        sync: false            # fill in Render dashboard
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # MySQL / PlanetScale / AWS RDS connection
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      # Supabase (if used for storage)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Firebase Storage
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # Frontend URL – used for CORS; points to the frontend service below
      - key: FRONTEND_URL
        fromService:
          name: healthcare-frontend
          type: web
          property: host
          # Render fills this in automatically as https://<service>.onrender.com
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "5000"

  # ── Frontend (Next.js) ──────────────────────────────────────────────────────
  - type: web
    name: healthcare-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      # Must point to the deployed backend URL so the browser can reach the API
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: healthcare-backend
          type: web
          property: host
      # Tell Next.js it's running in production
      - key: NODE_ENV
        value: production
      # Disable ESLint during build (Next.js 16 removed the config key and CLI flag)
      - key: NEXT_DISABLE_ESLINT_PLUGIN
        value: "1"
      # Disable Next.js telemetry
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
